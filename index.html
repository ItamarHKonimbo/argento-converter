// קבועים פנימיים שנגזרים ישירות מקוד ה-ARG של הספק (לא ניתנים לעריכה - אלה לא ערכים "עיצוביים")
const LETTER_TO_KEY = { E: "earrings", N: "necklaces", B: "bracelets", R: "rings" };
const PLATING_DIGIT_TO_KEY = { "1": "rh", "2": "gold", "3": "rose" };
const STONE_DIGIT_TO_KEY = { "0": "plain", "1": "white", "2": "blue", "3": "green", "4": "black", "6": "red", "7": "aqua", "8": "pink" };

// סדר קטגוריות רצוי בפלט: שרשראות → צמידים → טבעות → עגילים
const CATEGORY_SORT_ORDER = { N: 0, B: 1, R: 2, E: 3 };

// כוכבית בקוד ה-ARG מציינת "נטו" (מחיר נטו לאחר חישוב) - לא קשור לסטטוס "חדש"/"רגיל" של ה-sheet
const REMARK_RULES = [
  { re: /silver-?rhd/i, text: "כסף 925 ציפוי רודיום" },
  { re: /brass-?14k/i, text: "ציפוי זהב 14K (2 מיקרון)" },
  { re: /brass-?rose/i, text: "ציפוי רוזגולד (2 מיקרון)" }
];

function mapRemark(remarkText, platingText) {
  const source = `${remarkText} ${platingText}`;
  const rule = REMARK_RULES.find((r) => r.re.test(source));
  return rule ? rule.text : (remarkText || platingText);
}

const TRANSLATIONS_STORAGE_KEY = "argento_converter_translations_v1";

// הגדרת קבוצות המילון לעורך הטבלאות:
// fixed-map  = מפתחות קבועים (נגזרים מקוד ה-ARG עצמו) - אפשר לערוך רק את התרגום, לא להוסיף/למחוק שורות
// editable-map = מילון מפתח(אנגלית)->תרגום, אפשר להוסיף/למחוק/לערוך גם את המפתח (המפתח משמש להתאמה אוטומטית מהתיאור בקובץ המקור)
// list = רשימת ערכים בעברית בלבד (dropdown לבחירה ידנית, לא מותאם אוטומטית)
const DICT_GROUPS = [
  { key: "base_types", label: "סוג בסיס (תיאור באנגלית מהקובץ ← עברית)", type: "editable-map" },
  { key: "categories", label: "קטגוריה (רמה 1)", type: "fixed-map" },
  { key: "materials", label: "צבע מתכת", type: "fixed-map" },
  { key: "stone_colors", label: "צבע אבן", type: "fixed-map" },
  { key: "stone_shapes", label: "צורת אבן (מזוהה מתוך התיאור)", type: "editable-map" },
  { key: "shapes", label: "צורה כללית - תכשיט/תליון (מזוהה מתוך התיאור)", type: "editable-map" },
  { key: "subcategories", label: "תת-קטגוריה (רשימה לבחירה ידנית מה-dropdown)", type: "list" },
  { key: "subsubcategories", label: "תת-תת-קטגוריה (רשימה לבחירה ידנית מה-dropdown)", type: "list" }
];

function loadStoredTranslations() {
  try {
    const raw = localStorage.getItem(TRANSLATIONS_STORAGE_KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) {
    // localStorage לא זמין / JSON פגום - חוזרים לברירת המחדל
  }
  return DEFAULT_TRANSLATIONS;
}

const CODE_RE = /^(\*)?([A-Z]+)(\d+)-(\d+)-(\d+)-(.+)$/;
const CI_RE = /CI-(\d+)/i;
const MM_SIZE_RE = /\d+(\.\d+)?(\s*[*x×]\s*\d+(\.\d+)?)?\s*mm/i;

function isRowEmpty(row) {
  return row.every((c) => String(c ?? "").trim() === "");
}

function findKeyByMatch(dict, needleLower) {
  return Object.keys(dict || {}).find((k) => needleLower.includes(k.toLowerCase()));
}

function parseWorkbookFile(file, arrayBuffer, translations) {
  const wb = XLSX.read(arrayBuffer, { type: "array" });
  const ciMatch = file.name.match(CI_RE);
  const ciNumber = ciMatch ? ciMatch[1] : "";
  const parsed = [];
  const errors = [];

  for (const sheetName of wb.SheetNames) {
    const ws = wb.Sheets[sheetName];
    const rows = XLSX.utils.sheet_to_json(ws, { header: 1, defval: "" });
    // Row 0 = title row, Row 1 = header row, data starts at index 2
    for (let i = 2; i < rows.length; i++) {
      const r = rows[i];
      if (!r || isRowEmpty(r)) continue;

      const supplierNo = r[0];
      const codeRaw = String(r[1] ?? "").trim();
      const description = String(r[3] ?? "").trim();
      const quantity = r[4];
      const tagPrice = r[6];
      const platingText = String(r[7] ?? "").trim();
      const remark = String(r[8] ?? "").trim();
      const sourceRow = i + 1;

      if (!codeRaw) continue; // spacer row with no code

      const m = codeRaw.match(CODE_RE);
      if (!m) {
        errors.push({
          source_file: file.name,
          source_sheet: sheetName,
          source_row: sourceRow,
          arg_code_raw: codeRaw,
          reason: "קוד ARG לא תואם לפורמט הצפוי (חסרה ספרה / מקף כפול / תבנית לא מוכרת)"
        });
        continue;
      }

      const [, star, letter, baseSku, platingDigit, stoneDigit, sizeCode] = m;
      const tag = star ? "נטו" : "רגיל";

      const categoryKey = LETTER_TO_KEY[letter] || "";
      const category = translations.categories?.[categoryKey] || categoryKey;

      const materialKey = PLATING_DIGIT_TO_KEY[platingDigit] || "";
      const material = translations.materials?.[materialKey] || materialKey;

      const stoneKeyKnown = Object.prototype.hasOwnProperty.call(STONE_DIGIT_TO_KEY, stoneDigit);
      const stoneKey = stoneKeyKnown ? STONE_DIGIT_TO_KEY[stoneDigit] : "";
      const stoneColor = stoneKeyKnown ? (translations.stone_colors?.[stoneKey] || stoneKey) : stoneDigit;

      const descLines = description.split(/\r?\n/).map((s) => s.trim()).filter(Boolean);
      const baseEn = (descLines[0] || "").toLowerCase();
      const subcategoryRaw = descLines.slice(1).join(" | ");

      let baseHe = "";
      let hasTranslation = !baseEn;
      if (baseEn) {
        const key = Object.keys(translations.base_types || {}).find((k) => k.toLowerCase() === baseEn);
        if (key) {
          baseHe = translations.base_types[key];
          hasTranslation = true;
        }
      }

      // מידה = מהקוד (מידת טבעת/צמיד), אם אין (A) - נשאר ריק
      const sizeDisplay = sizeCode.toUpperCase() !== "A" ? sizeCode : "";

      // גודל אבן (מ"מ) = טקסט עם mm בתיאור, למשל "9mm" / "5*19mm"
      const isMmSize = subcategoryRaw && MM_SIZE_RE.test(subcategoryRaw);
      const stoneSizeDisplay = isMmSize ? subcategoryRaw : "";

      // צורה: מנסים להתאים רק אם זה לא טקסט מידה
      const canAttemptShape = subcategoryRaw && !isMmSize && !/^\d+$/.test(subcategoryRaw);
      let stoneShapeHe = "";
      let shapeHe = "";
      let stoneShapeFound = false;
      let shapeFound = false;
      if (canAttemptShape) {
        const lowerSub = subcategoryRaw.toLowerCase();
        const stoneShapeKey = findKeyByMatch(translations.stone_shapes, lowerSub);
        if (stoneShapeKey) {
          stoneShapeHe = translations.stone_shapes[stoneShapeKey];
          stoneShapeFound = true;
        }
        const shapeKey = findKeyByMatch(translations.shapes, lowerSub);
        if (shapeKey) {
          shapeHe = translations.shapes[shapeKey];
          shapeFound = true;
        }
      }

      const flagReasons = [];
      if (!stoneKeyKnown) flagReasons.push(`ספרת אבן ${stoneDigit} לא ברשימה הידועה`);
      if (baseEn && !hasTranslation) flagReasons.push(`אין תרגום ל-"${baseEn}"`);
      if (canAttemptShape && !stoneShapeFound && !shapeFound) {
        flagReasons.push(`לא נמצאה התאמת צורה עבור "${subcategoryRaw}"`);
      }

      // התמונות של הספק צולמו לפי בסיס+פלטינג+אבן בלבד - וריאנטים באותה מידה שונה (S/M/L, מידות טבעת)
      // חולקים את אותה תמונה, אז מפתח ההתאמה לתמונה לא כולל את המידה
      const imageKey = `${letter}${baseSku}-${platingDigit}-${stoneDigit}`;

      parsed.push({
        source_file: file.name,
        ci_number: ciNumber,
        source_sheet: sheetName,
        source_row: sourceRow,
        supplier_no: supplierNo,
        arg_code_raw: codeRaw,
        image_key: imageKey,
        type_letter: letter,
        tag,
        category,
        base_sku: baseSku,
        material,
        stone_color: stoneColor,
        stone_size: stoneSizeDisplay,
        size_display: sizeDisplay,
        description_base_he: baseHe || baseEn,
        stone_shape_he: stoneShapeHe,
        shape_he: shapeHe,
        subcategory_raw: subcategoryRaw,
        quantity,
        tag_price: tagPrice,
        remark: mapRemark(remark, platingText),
        needs_review: flagReasons.length > 0 ? "כן" : "",
        flag_reason: flagReasons.join(" ; ")
      });
    }
  }

  return { parsed, errors };
}

function setListDataValidation(ws, colIdx, rowCount, listRangeRef) {
  for (let r = 2; r <= rowCount + 1; r++) {
    ws.getCell(r, colIdx).dataValidation = {
      type: "list",
      allowBlank: true,
      formulae: [listRangeRef]
    };
  }
}

function extFromFileName(name) {
  const m = String(name).match(/\.([a-zA-Z0-9]+)$/);
  const ext = m ? m[1].toLowerCase() : "";
  if (ext === "jpg") return "jpeg";
  if (ext === "jpeg" || ext === "png" || ext === "gif") return ext;
  return null; // ExcelJS תומך רק ב-jpeg/png/gif להטמעה ישירה - פורמטים אחרים (webp/bmp/...) מומרים ל-PNG בזמן ריצה
}

// שמות קבצי התמונות של הספק לא תמיד מגיעים נקיים (רווח מקרי לפני המקף, מקף כפול וכו') -
// מנקים רווחים ומקפים כפולים לפני חילוץ בסיס+פלטינג+אבן
const IMAGE_KEY_RE = /^([A-Za-z]+)(\d+)-(\d+)-(\d+)/;

function extractImageKey(rawName) {
  const cleaned = String(rawName)
    .trim()
    .replace(/\s+/g, "")
    .replace(/-{2,}/g, "-");
  const m = cleaned.match(IMAGE_KEY_RE);
  if (m) {
    const [, letter, base, plating, stone] = m;
    return `${letter.toUpperCase()}${base}-${plating}-${stone}`;
  }
  return cleaned.toUpperCase();
}

function buildFolderImageMap(imageFiles) {
  const map = new Map();
  (imageFiles || []).forEach((file) => {
    const base = file.name.replace(/\.[^.]+$/, "");
    const key = extractImageKey(base);
    // אם כבר יש תמונה לאותו מפתח (בסיס+פלטינג+אבן) - משאירים את הראשונה, לא דורסים
    if (!map.has(key)) map.set(key, file);
  });
  return map;
}

// המרת תמונה בפורמט שExcelJS לא יודע להטמיע ישירות (webp/bmp/svg/...) ל-PNG, בעזרת קנבס בדפדפן
async function convertImageToPng(file) {
  try {
    const bitmap = await createImageBitmap(file);
    const canvas = document.createElement("canvas");
    canvas.width = bitmap.width;
    canvas.height = bitmap.height;
    canvas.getContext("2d").drawImage(bitmap, 0, 0);
    const blob = await new Promise((resolve) => canvas.toBlob(resolve, "image/png"));
    if (!blob) return null;
    return { buffer: await blob.arrayBuffer(), extension: "png" };
  } catch (e) {
    return null; // פורמט שהדפדפן עצמו לא יודע לפענח
  }
}

// חילוץ תמונות שמוטמעות בתוך קובץ המקור עצמו (עמודת Photo) - fallback בלבד, בעדיפות נמוכה מתיקיית התמונות
async function extractSourceImages(arrayBuffer) {
  const map = new Map();
  try {
    const wbImg = new ExcelJS.Workbook();
    await wbImg.xlsx.load(arrayBuffer);
    wbImg.worksheets.forEach((ws) => {
      (ws.getImages() || []).forEach((img) => {
        const media = wbImg.getImage(parseInt(img.imageId, 10));
        if (!media) return;
        const rowNum = Math.round(img.range.tl.row) + 1;
        map.set(`${ws.name}::${rowNum}`, media);
      });
    });
  } catch (e) {
    // קובץ בלי תמונות מוטמעות / לא נתמך - מתעלמים, זה fallback בלבד
  }
  return map;
}

async function buildWorkbook(allParsed, allErrors, translations, folderImageMap, sourceImagesMap) {
  const wb = new ExcelJS.Workbook();

  const sortedParsed = [...allParsed].sort(
    (a, b) => (CATEGORY_SORT_ORDER[a.type_letter] ?? 99) - (CATEGORY_SORT_ORDER[b.type_letter] ?? 99)
  );

  const listGroups = [
    { key: "A", values: Object.values(translations.categories || {}) },
    { key: "B", values: translations.subcategories || [] },
    { key: "C", values: translations.subsubcategories || [] },
    { key: "D", values: Object.values(translations.materials || {}) },
    { key: "E", values: Object.values(translations.stone_colors || {}) },
    { key: "F", values: Object.values(translations.stone_shapes || {}) },
    { key: "G", values: Object.values(translations.shapes || {}) }
  ];

  const wsLists = wb.addWorksheet("Lists");
  wsLists.state = "hidden";
  listGroups.forEach(({ key, values }) => {
    values.forEach((v, idx) => (wsLists.getCell(`${key}${idx + 1}`).value = v));
  });
  const rangeFor = (key) => {
    const group = listGroups.find((g) => g.key === key);
    const len = Math.max(group.values.length, 1);
    return `Lists!$${key}$1:$${key}$${len}`;
  };

  const wsVariants = wb.addWorksheet("Variants");
  wsVariants.views = [{ rightToLeft: true }];
  const variantCols = [
    ["arg_code_raw", "קוד ARG"],
    ["image", "תמונה"],
    ["tag", "תג"],
    ["category", "קטגוריה"],
    ["subcategory_final", "תת-קטגוריה"],
    ["subsubcategory_final", "תת-תת-קטגוריה"],
    ["material", "צבע מתכת"],
    ["stone_color", "צבע אבן"],
    ["stone_shape_he", "צורת אבן"],
    ["shape_he", "צורה"],
    ["stone_size", "גודל אבן (מ\"מ)"],
    ["size_display", "מידה"],
    ["base_sku", "מספר בסיס"],
    ["description_base_he", "סוג בסיס (עברית)"],
    ["quantity", "כמות"],
    ["tag_price", "מחיר"],
    ["remark", "הערה"],
    ["needs_review", "לבדיקה"]
  ];
  wsVariants.addRow(variantCols.map((c) => c[1]));
  const emptyByDefault = new Set(["subcategory_final", "subsubcategory_final", "image"]);
  sortedParsed.forEach((row) => {
    wsVariants.addRow(variantCols.map(([key]) => (emptyByDefault.has(key) ? "" : row[key] ?? "")));
  });

  const colIdx = (key) => variantCols.findIndex((c) => c[0] === key) + 1;
  setListDataValidation(wsVariants, colIdx("category"), sortedParsed.length, rangeFor("A"));
  setListDataValidation(wsVariants, colIdx("subcategory_final"), sortedParsed.length, rangeFor("B"));
  setListDataValidation(wsVariants, colIdx("subsubcategory_final"), sortedParsed.length, rangeFor("C"));
  setListDataValidation(wsVariants, colIdx("material"), sortedParsed.length, rangeFor("D"));
  setListDataValidation(wsVariants, colIdx("stone_color"), sortedParsed.length, rangeFor("E"));
  setListDataValidation(wsVariants, colIdx("stone_shape_he"), sortedParsed.length, rangeFor("F"));
  setListDataValidation(wsVariants, colIdx("shape_he"), sortedParsed.length, rangeFor("G"));
  wsVariants.columns.forEach((col) => (col.width = 16));
  wsVariants.getColumn(colIdx("image")).width = 14;

  const imgColLetter = wsVariants.getColumn(colIdx("image")).letter;
  const imageStats = { fromFolder: 0, convertedFormat: 0, fromSourceFallback: 0, notFound: 0, unsupportedFormat: [] };
  for (let i = 0; i < sortedParsed.length; i++) {
    const row = sortedParsed[i];
    const rowNum = i + 2;
    let buffer = null;
    let extension = null;
    const folderFile = folderImageMap && folderImageMap.get(row.image_key);
    if (folderFile) {
      extension = extFromFileName(folderFile.name);
      if (extension) {
        buffer = await folderFile.arrayBuffer();
        imageStats.fromFolder++;
      } else {
        const converted = await convertImageToPng(folderFile);
        if (converted) {
          buffer = converted.buffer;
          extension = converted.extension;
          imageStats.convertedFormat++;
        } else {
          imageStats.unsupportedFormat.push(folderFile.name);
        }
      }
    }
    if (!buffer && sourceImagesMap) {
      const media = sourceImagesMap.get(`${row.source_file}::${row.source_sheet}::${row.source_row}`);
      if (media) {
        buffer = media.buffer;
        extension = media.extension;
        imageStats.fromSourceFallback++;
      }
    }
    if (buffer && extension) {
      const imageId = wb.addImage({ buffer, extension });
      wsVariants.getRow(rowNum).height = 70;
      wsVariants.addImage(imageId, `${imgColLetter}${rowNum}:${imgColLetter}${rowNum}`);
    } else if (!folderFile) {
      imageStats.notFound++;
    }
  }

  const wsSource = wb.addWorksheet("מקור");
  wsSource.views = [{ rightToLeft: true }];
  const sourceCols = [
    ["source_file", "קובץ מקור"],
    ["ci_number", "מספר CI"],
    ["source_sheet", "Sheet מקור"],
    ["source_row", "שורה במקור"],
    ["supplier_no", "מספר ספק (No.)"],
    ["arg_code_raw", "קוד ARG"]
  ];
  wsSource.addRow(sourceCols.map((c) => c[1]));
  sortedParsed.forEach((row) => {
    wsSource.addRow(sourceCols.map(([key]) => row[key] ?? ""));
  });
  wsSource.columns.forEach((col) => (col.width = 18));

  const wsErrors = wb.addWorksheet("Errors");
  wsErrors.views = [{ rightToLeft: true }];
  const errorCols = [
    ["source_file", "קובץ מקור"],
    ["source_sheet", "Sheet מקור"],
    ["source_row", "שורה במקור"],
    ["arg_code_raw", "קוד ARG"],
    ["reason", "סיבה"]
  ];
  wsErrors.addRow(errorCols.map((c) => c[1]));
  allErrors.forEach((row) => {
    wsErrors.addRow(errorCols.map(([key]) => row[key] ?? ""));
  });
  wsErrors.columns.forEach((col) => (col.width = 22));

  const wsFlags = wb.addWorksheet("Flags");
  wsFlags.views = [{ rightToLeft: true }];
  const flagCols = [
    ["arg_code_raw", "קוד ARG"],
    ["category", "קטגוריה"],
    ["stone_color", "צבע אבן"],
    ["description_base_he", "סוג בסיס"],
    ["subcategory_raw", "תת-סוג גולמי (מקור)"],
    ["flag_reason", "סיבת דגל"],
    ["source_file", "קובץ מקור"],
    ["source_row", "שורה במקור"]
  ];
  wsFlags.addRow(flagCols.map((c) => c[1]));
  sortedParsed.filter((r) => r.needs_review === "כן").forEach((row) => {
    wsFlags.addRow(flagCols.map(([key]) => row[key] ?? ""));
  });
  wsFlags.columns.forEach((col) => (col.width = 22));

  return { wb, imageStats };
}

function MapGroup({ group, dict, onChange }) {
  const entries = Object.entries(dict || {});
  const editableKey = group.type === "editable-map";

  function updateKey(oldKey, newKey) {
    const next = {};
    entries.forEach(([k, v]) => {
      next[k === oldKey ? newKey : k] = v;
    });
    onChange(next);
  }
  function updateValue(k, newValue) {
    onChange({ ...dict, [k]: newValue });
  }
  function removeRow(k) {
    const next = { ...dict };
    delete next[k];
    onChange(next);
  }
  function addRow() {
    let newKey = "מונח_חדש";
    let i = 1;
    while (Object.prototype.hasOwnProperty.call(dict, newKey)) {
      newKey = `מונח_חדש_${i++}`;
    }
    onChange({ ...dict, [newKey]: "" });
  }

  return (
    <div className="dict-group">
      <h4>{group.label}</h4>
      <table className="dict-table">
        <thead>
          <tr>
            <th>מקור (אנגלית)</th>
            <th>תרגום לעברית</th>
            {editableKey && <th></th>}
          </tr>
        </thead>
        <tbody>
          {entries.map(([k, v]) => (
            <tr key={k}>
              <td>
                {editableKey ? (
                  <input className="ltr-input" value={k} onChange={(e) => updateKey(k, e.target.value)} />
                ) : (
                  <input className="ltr-input" value={k} disabled />
                )}
              </td>
              <td>
                <input value={v} onChange={(e) => updateValue(k, e.target.value)} />
              </td>
              {editableKey && (
                <td>
                  <button className="secondary small" onClick={() => removeRow(k)}>
                    הסר
                  </button>
                </td>
              )}
            </tr>
          ))}
        </tbody>
      </table>
      {editableKey && (
        <button className="secondary small" onClick={addRow}>
          + הוספת ערך
        </button>
      )}
    </div>
  );
}

function ListGroup({ group, list, onChange }) {
  const values = list || [];

  function updateValue(idx, newValue) {
    const next = [...values];
    next[idx] = newValue;
    onChange(next);
  }
  function removeRow(idx) {
    onChange(values.filter((_, i) => i !== idx));
  }
  function addRow() {
    onChange([...values, ""]);
  }

  return (
    <div className="dict-group">
      <h4>{group.label}</h4>
      <table className="dict-table">
        <tbody>
          {values.map((v, idx) => (
            <tr key={idx}>
              <td>
                <input value={v} onChange={(e) => updateValue(idx, e.target.value)} />
              </td>
              <td>
                <button className="secondary small" onClick={() => removeRow(idx)}>
                  הסר
                </button>
              </td>
            </tr>
          ))}
        </tbody>
      </table>
      <button className="secondary small" onClick={addRow}>
        + הוספת ערך
      </button>
    </div>
  );
}

function TranslationsEditor({ translations, setTranslations }) {
  return (
    <div>
      {DICT_GROUPS.map((group) =>
        group.type === "list" ? (
          <ListGroup
            key={group.key}
            group={group}
            list={translations[group.key]}
            onChange={(next) => setTranslations({ ...translations, [group.key]: next })}
          />
        ) : (
          <MapGroup
            key={group.key}
            group={group}
            dict={translations[group.key]}
            onChange={(next) => setTranslations({ ...translations, [group.key]: next })}
          />
        )
      )}
    </div>
  );
}

function App() {
  const [files, setFiles] = useState([]);
  const [imageFiles, setImageFiles] = useState([]);
  const [translations, setTranslations] = useState(loadStoredTranslations);
  const [showJsonEditor, setShowJsonEditor] = useState(false);
  const [jsonDraft, setJsonDraft] = useState("");
  const [jsonError, setJsonError] = useState("");
  const [result, setResult] = useState(null);
  const [error, setError] = useState("");
  const [running, setRunning] = useState(false);

  useEffect(() => {
    try {
      localStorage.setItem(TRANSLATIONS_STORAGE_KEY, JSON.stringify(translations));
    } catch (e) {
      // localStorage לא זמין - השינויים לא יישמרו בין טעינות, אבל ההרצה הנוכחית עדיין תעבוד
    }
  }, [translations]);

  function openJsonEditor() {
    setJsonDraft(JSON.stringify(translations, null, 2));
    setJsonError("");
    setShowJsonEditor(true);
  }
  function applyJsonDraft() {
    try {
      const parsed = JSON.parse(jsonDraft);
      setTranslations(parsed);
      setJsonError("");
    } catch (e) {
      setJsonError("JSON לא תקין: " + e.message);
    }
  }
  function resetTranslationsToDefault() {
    if (!confirm("לאפס את מילון התרגום לברירת המחדל? כל השינויים שנשמרו יימחקו.")) return;
    setTranslations(DEFAULT_TRANSLATIONS);
  }

  async function handleRun() {
    setError("");
    setResult(null);
    if (!files.length) {
      setError("יש לבחור קובץ אקסל אחד או יותר.");
      return;
    }
    setRunning(true);
    try {
      const folderImageMap = buildFolderImageMap(imageFiles);
      let allParsed = [];
      let allErrors = [];
      const sourceImagesMap = new Map();
      for (const file of files) {
        const buf = await file.arrayBuffer();
        const { parsed, errors } = parseWorkbookFile(file, buf, translations);
        allParsed = allParsed.concat(parsed);
        allErrors = allErrors.concat(errors);

        // חילוץ תמונות מהקובץ המקורי (ExcelJS, כבד) נעשה רק אם יש שורה שלא נמצאה לה תמונה בתיקייה
        const needsSourceFallback = parsed.some((row) => !folderImageMap.has(row.image_key));
        if (needsSourceFallback) {
          const fileImages = await extractSourceImages(buf);
          fileImages.forEach((v, k) => sourceImagesMap.set(`${file.name}::${k}`, v));
        }
      }
      const { wb, imageStats } = await buildWorkbook(allParsed, allErrors, translations, folderImageMap, sourceImagesMap);
      const buffer = await wb.xlsx.writeBuffer();
      const blob = new Blob([buffer], { type: "application/octet-stream" });
      const url = URL.createObjectURL(blob);
      const flaggedCount = allParsed.filter((v) => v.needs_review === "כן").length;
      setResult({
        url,
        total: allParsed.length,
        errors: allErrors.length,
        flagged: flaggedCount,
        imageStats
      });
    } catch (e) {
      setError("שגיאה בעיבוד הקבצים: " + e.message);
    } finally {
      setRunning(false);
    }
  }

  return (
    <div>
      <h1>ממיר אקסלים - ספק ארג'נטו → קובץ וריאנטים מאוחד</h1>

      <div className="box">
        <h3>1. בחירת קבצי אקסל של הספק</h3>
        <input
          type="file"
          multiple
          accept=".xls,.xlsx"
          onChange={(e) => setFiles(Array.from(e.target.files))}
        />
        <div className="files-list">
          {files.length > 0 && (
            <ul>
              {files.map((f, i) => (
                <li key={i}>{f.name}</li>
              ))}
            </ul>
          )}
        </div>
      </div>

      <div className="box">
        <h3>2. תיקיית תמונות (אופציונלי)</h3>
        <p className="hint">
          בחירת תיקייה שלמה - כל תמונה בשם זהה לקוד ה-ARG (בלי כוכבית, למשל B1000531-1-1-M.jpg)
          תוטמע אוטומטית בעמודת "תמונה" ליד השורה המתאימה. אם לא נמצאה תמונה בתיקייה - ננסה להשתמש
          בתמונה שמוטמעת בעמודת Photo בקובץ המקור עצמו (עדיפות שנייה, אם קיימת).
        </p>
        <input
          type="file"
          webkitdirectory=""
          directory=""
          multiple
          onChange={(e) => setImageFiles(Array.from(e.target.files))}
        />
        <div className="files-list">
          {imageFiles.length > 0 && <span>{imageFiles.length} תמונות נבחרו</span>}
        </div>
      </div>

      <div className="box">
        <h3>3. מילון תרגום וקטגוריות (אפשר לערוך/להוסיף ערכים)</h3>
        <p className="hint">
          כל הרשימות כאן הופכות לרשימות הבחירה (dropdown) בקובץ הפלט. אפשר להוסיף שורה חדשה בכל טבלה
          שבה יש כפתור "הוספת ערך", או להסיר שורה עם "הסר". השינויים נשמרים אוטומטית בדפדפן הזה
          ויישארו גם בפעם הבאה שתפתחי את הדף.
        </p>
        <TranslationsEditor translations={translations} setTranslations={setTranslations} />

        <div style={{ marginTop: 12 }}>
          <button className="secondary small" onClick={resetTranslationsToDefault}>
            איפוס לברירת מחדל
          </button>{" "}
          <button className="secondary small" onClick={() => (showJsonEditor ? setShowJsonEditor(false) : openJsonEditor())}>
            {showJsonEditor ? "סגירת עריכה מתקדמת" : "עריכה מתקדמת (JSON)"}
          </button>
        </div>

        {showJsonEditor && (
          <div style={{ marginTop: 12 }}>
            <p className="hint">
              עריכה ישירה של כל המילון כ-JSON. לחיצה על "החלת שינויים" תעדכן את הטבלאות למעלה.
            </p>
            <textarea value={jsonDraft} onChange={(e) => setJsonDraft(e.target.value)} />
            {jsonError && <div className="flag">{jsonError}</div>}
            <button onClick={applyJsonDraft}>החלת שינויים</button>
          </div>
        )}
      </div>

      <div className="box">
        <h3>4. הרצה והורדה</h3>
        <button onClick={handleRun} disabled={running}>
          {running ? "מעבד..." : "הרץ המרה"}
        </button>
        {error && <p className="flag">{error}</p>}
        {result && (
          <div style={{ marginTop: 12 }}>
            <div className="summary">
              <span>סה"כ שורות תקינות: {result.total}</span>
              <span>שגיאות: {result.errors}</span>
              <span>דגלים לבדיקה: {result.flagged}</span>
            </div>
            {result.imageStats && (
              <p className="hint">
                תמונות: {result.imageStats.fromFolder} מהתיקייה
                {result.imageStats.convertedFormat > 0 && ` (מהן ${result.imageStats.convertedFormat} הומרו מפורמט לא-נתמך)`}
                {result.imageStats.fromSourceFallback > 0 && `, ${result.imageStats.fromSourceFallback} מהקובץ המקורי`}
                , {result.imageStats.notFound} שורות בלי תמונה בכלל
                {result.imageStats.unsupportedFormat.length > 0 &&
                  ` | לא ניתן להטמיע (${result.imageStats.unsupportedFormat.length}): ${result.imageStats.unsupportedFormat.join(", ")}`}
              </p>
            )}
            <a href={result.url} download="argento-variants-merged.xlsx">
              <button className="secondary">הורד קובץ מאוחד</button>
            </a>
          </div>
        )}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
